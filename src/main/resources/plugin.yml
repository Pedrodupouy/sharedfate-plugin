name: SharedFate
version: '1.0.0'
main: com.pedro.sharedfate.SharedFatePlugin
api-version: '1.21'
author: Pedro
description: 'Vida, hambre y minado compartidos entre jugadores para servidores hardcore cooperativos'
commands:
